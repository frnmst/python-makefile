[build-system]
requires = ["hatchling >= 1.30"]
build-backend = "hatchling.build"

[project]
name = "python-makefile"
version = "0.4.0"
authors = [
    { name = "Franco Masotti" },
]
description = "Python Makefile"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pip-audit",
    "build",
    "twine",
    "hatchling",
]

# Non-Python package repositories: do not include anything in the package.
[tool.hatch.build]
include = []

[tool.hatch.build.targets.sdist]
reproducible = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
reproducible = true

[tool.bandit]
skips=["B404", "B506", "B410", "B603", "B324"]

[tool.commitizen]
name = "cz_gitmoji"
