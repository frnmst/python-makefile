[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "python-makefile"
version = "0.0.0"
authors = [
    { name = "Franco Masotti" },
]
description = "Python Makefile"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pip-tools", # Development-only dependency management.
    "pip-audit",
    "build",
]

[tool.setuptools.packages.find]
include = []
exclude = ["*"]

[tool.bandit]
skips=["B404", "B506", "B410", "B603", "B324"]

[tool.commitizen]
name = "cz_gitmoji"
